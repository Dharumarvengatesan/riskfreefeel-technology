<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110" role="img" aria-label="RiskFreeFeel Technologies">
  <defs>
    <style>
      .brand-bold {
        font-family: 'Arial Black', 'Franklin Gothic Heavy', 'Impact', sans-serif;
        font-weight: 900;
      }
      .brand-tag {
        font-family: 'Arial', 'Helvetica Neue', sans-serif;
        font-weight: 600;
        letter-spacing: 0.24em;
      }
      /* R letter colour — dark in light mode, white/light in dark mode */
      .r-letter { fill: #0B0F1A; }
      .wordmark-primary { fill: #0B0F1A; }

      @media (prefers-color-scheme: dark) {
        .r-letter       { fill: #F1F5F9; }
        .wordmark-primary { fill: #F1F5F9; }
      }
    </style>
  </defs>

  <!-- ══ PIXEL DOT GRID ══ -->
  <rect x="8"  y="8"  width="5" height="5" rx="1" fill="#0EA5E9"/>
  <rect x="15" y="8"  width="5" height="5" rx="1" fill="#0EA5E9"/>
  <rect x="22" y="8"  width="5" height="5" rx="1" fill="#0EA5E9"/>
  <rect x="29" y="8"  width="5" height="5" rx="1" fill="#0EA5E9" opacity="0.7"/>
  <rect x="8"  y="15" width="5" height="5" rx="1" fill="#0EA5E9"/>
  <rect x="15" y="15" width="5" height="5" rx="1" fill="#0EA5E9" opacity="0.5"/>
  <rect x="22" y="15" width="5" height="5" rx="1" fill="#0EA5E9" opacity="0.3"/>
  <rect x="8"  y="22" width="5" height="5" rx="1" fill="#0EA5E9" opacity="0.4"/>
  <rect x="15" y="22" width="5" height="5" rx="1" fill="#0EA5E9" opacity="0.2"/>

  <!-- ══ R LETTERFORM — theme-aware colour ══ -->
  <path class="r-letter" d="
    M16 28
    L16 98
    L33 98
    L33 72
    L47 72
    L63 98
    L82 98
    L63 69
    C73 64 79 55 79 43
    C79 30 70 20 57 20
    L16 20
    Z
    M33 34 L55 34 C62 34 66 39 66 45 C66 52 62 57 55 57 L33 57 Z
  "/>

  <!-- ══ F LETTERFORM — sky blue (always visible) ══ -->
  <path fill="#0EA5E9" d="
    M72 38
    L72 98
    L89 98
    L89 73
    L110 73
    L110 60
    L89 60
    L89 51
    L114 51
    L114 38
    Z
  "/>

  <!-- Blue accent bar at bottom of F -->
  <rect x="64" y="94" width="54" height="6" rx="2.5" fill="#0EA5E9"/>

  <!-- ══ WORDMARK ══ -->
  <!-- "RiskFreeFeel" — theme-aware -->
  <text
    x="134" y="58"
    class="brand-bold wordmark-primary"
    font-size="38"
    dominant-baseline="auto"
  >RiskFreeFeel</text>

  <!-- "Technologies" — sky blue (always visible) -->
  <text
    x="134" y="92"
    class="brand-bold"
    font-size="32"
    fill="#0EA5E9"
    dominant-baseline="auto"
  >Technologies</text>

  <!-- Separator line -->
  <line x1="134" y1="96" x2="454" y2="96" stroke="#0EA5E9" stroke-width="1.5" opacity="0.4"/>

  <!-- Tagline -->
  <text
    x="134" y="107"
    class="brand-tag"
    font-size="8"
    fill="#0EA5E9"
    dominant-baseline="auto"
  >INNOVATE  •  BUILD  •  GROW</text>

</svg>
