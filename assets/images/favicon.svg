<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RiskFreeFeel Technologies Favicon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Centered RF Logo Mark -->
  <g transform="translate(112, 100) scale(2.4)">
    <!-- Pixel dot grid -->
    <rect x="8"  y="8"  width="6" height="6" rx="1.5" fill="#38BDF8"/>
    <rect x="16" y="8"  width="6" height="6" rx="1.5" fill="#38BDF8"/>
    <rect x="24" y="8"  width="6" height="6" rx="1.5" fill="#38BDF8"/>
    <rect x="32" y="8"  width="6" height="6" rx="1.5" fill="#38BDF8" opacity="0.7"/>
    <rect x="8"  y="16" width="6" height="6" rx="1.5" fill="#38BDF8"/>
    <rect x="16" y="16" width="6" height="6" rx="1.5" fill="#38BDF8" opacity="0.5"/>
    <rect x="24" y="16" width="6" height="6" rx="1.5" fill="#38BDF8" opacity="0.3"/>
    <rect x="8"  y="24" width="6" height="6" rx="1.5" fill="#38BDF8" opacity="0.4"/>
    <rect x="16" y="24" width="6" height="6" rx="1.5" fill="#38BDF8" opacity="0.2"/>

    <!-- R — White -->
    <path fill="#FFFFFF" d="M16 28 L16 98 L33 98 L33 72 L47 72 L63 98 L82 98 L63 69 C73 64 79 55 79 43 C79 30 70 20 57 20 L16 20 Z M33 34 L55 34 C62 34 66 39 66 45 C66 52 62 57 55 57 L33 57 Z"/>

    <!-- F — Sky Blue -->
    <path fill="#38BDF8" d="M72 38 L72 98 L89 98 L89 73 L110 73 L110 60 L89 60 L89 51 L114 51 L114 38 Z"/>

    <!-- Accent bar -->
    <rect x="64" y="94" width="54" height="6" rx="3" fill="#38BDF8"/>
  </g>
</svg>
